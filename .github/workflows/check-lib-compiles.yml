name: "Check Library Compiles"
on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Compile Main Func in Telemetry.go
        run: go build telemetry.go
